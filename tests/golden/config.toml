# ============================================================
#  livecut-en — конфигурация конвейера livecut-ai
#  Имена ключей (на португальском) читаются модулем settings.py.
#  Секреты и токены хранятся в .env, не здесь.
# ============================================================

[geral]
perfil_tiktok = "@your_handle"
qualidade = "1080p60,1080p,best"
buffer_minutos = 10
pasta_dados = ""
dias_guardar_clipes = 3
estilo_legenda = "karaoke"
titulo_segundos = 3
layout_video = "vertical"
tema_noticia = "visor"
posicao_noticia = "baixo"
clipe_inteiro = true

[detector]
janela_segundos = 10
multiplicador_minimo = 2.5
multiplicador_forte = 4
reacao_minima = 0.25
chat_grande_msgs_s = 5
chat_grande_multiplicador = 1.3
chat_grande_reacao = 0.35
cooldown_segundos = 60
audio_db_acima = 14
audio_sozinho_db = 24
clipes_janela_segundos = 90
clipes_minimo = 8
clipes_multiplicador = 3
intervalo_previas_segundos = 180
min_palavras_previa = 20
pre_roll = 60
post_roll = 10

[ia]
nota_minima = 6
enviar_reprovados = false
aprovacao_manual = true
limite_analises_hora = 20
orcamento_diario_usd = 5.0
min_palavras = 4

# ------------------------------------------------------------
#  Отслеживаемые каналы (4 активн.)
# ------------------------------------------------------------

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build && npm run check:bundle
      - run: npm run make:kit

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            kit-dist/livecut-en-kit.zip
            kit-dist/apply_en_patch.py
            kit-dist/config.toml
            kit-dist/.env.example
            kit-dist/SETUP_RU.md
            kit-dist/README.md
